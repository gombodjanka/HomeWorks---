    <script>
        async function menuAndIngPrice() {
            let [menu, ingredientsPrice] = await Promise.all ([
                fetch("./Asynchrony/menu.json").then (r => r.json()),
                fetch("./Asynchrony/ingredientsPrice.json").then (r2 => r2.json())
            ])

            function profit(numberDishPrise, dishIngredients) {
                let dishExpenses = 0; 
                for (let i = 0; i < dishIngredients.length; i++) {
                    let ingredient = dishIngredients[i];
                    dishExpenses += ingredientsPrice[ingredient];
                }
                 return numberDishPrise - dishExpenses;
            }
            for (let i = 0; i < menu.length; i++) {
                menu[i].profit = profit(menu[i].price, menu[i].ingredients);
            }    
            console.log(menu);
        }    

        menuAndIngPrice().catch((error) => alert(error));
